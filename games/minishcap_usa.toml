# Perfil de The Legend of Zelda: The Minish Cap (USA). Solo direcciones, nombres y tamaños; ningún byte del juego.
# Borrador: el motor (gba-recomp) todavía no lee perfiles; de momento estos datos se pasan por la línea de órdenes, p. ej.
#   gba-recomp trace roms/minishcap_usa.gba --pointers --overlay 030056F0:080B197C:135C --overlay 0300404C:080AF3A4:380

[game]
id = "minishcap_usa"
title = "The Legend of Zelda: The Minish Cap (USA)"
sha1 = "b4bd50e4131b027c334547b4524e2dbbd4227130"
crc32 = "ABCEBBB1"
entry = "08000000"      # b 080000C0; AgbMain en 08055E6C

# Bloques que el arranque copia de la ROM a la RAM y que se ejecutan desde allí (código ARM en IWRAM).
# El origen y el tamaño salen de los literales de 08055FDC..08055FE4 (la rutina de copia de 0801D66C).
[[overlay]]
name = "iwram_code"
ram = "030056F0"
rom = "080B197C"
len = "135C"

# El mezclador de sonido (M4A): m4aSoundInit (080AFF48) lo copia con CpuSet; origen y destino en 080AFF9C..080AFFA4,
# control 040000E0 = 0xE0 palabras de 32 bits.
[[overlay]]
name = "m4a_sound_main"
ram = "0300404C"
rom = "080AF3A4"
len = "380"

# Raíces dinámicas halladas ejecutando (tools/complete.sh).
[roots]
file = "dynamic_roots.txt"

# Dónde se toman y cargan los estados guardados: el bucle principal de AgbMain (r4 = r6 = 0x03001000).
[resume]
address = "08055EC8"
